<body>
<div class="app"><aside class="side"><div class="brand"><span class="mark">G</span> THE <span style="color:#b975ff">GRID</span></div><nav class="nav" id="nav"></nav><button class="cta" onclick="compose()">＋ Crear publicación</button><button class="profileMini" onclick="openProfile()"><span class="avatar g">G</span><span><b>Tu perfil</b><small>@usuario</small></span><span>•••</span></button></aside>
<main class="feed"><header class="top"><div><span class="eyebrow">THE GRID</span><h1 id="title">Inicio</h1></div><div class="tools"><label class="search">⌕<input id="search" placeholder="Buscar" oninput="render()"></label><button class="circle" onclick="openNotifications()">♢</button><button class="avatar g" onclick="openProfile()">G</button></div></header><div id="view"></div></main>
<aside class="rail"><div class="card"><div class="cover"></div><div class="cardBody"><div class="avatar g">G</div><button class="follow" id="follow" onclick="toggleFollow()">Seguir</button><h3>Tu perfil</h3><span class="muted">@usuario</span><p>Explorando The Grid · Creator preview</p></div></div><div class="card railInner"><div class="railTitle">● Tendencias <span>↻</span></div><div class="trend"><small>01 · GAMING</small><b>#NeonRunner</b><span>2,840 posts</span></div><div class="trend"><small>02 · CREATOR</small><b>#GridStudio</b><span>1,420 posts</span></div><div class="trend"><small>03 · PULSE</small><b>#NightDrive</b><span>982 posts</span></div></div><div class="card railInner"><div class="railTitle">🔴 En vivo ahora <span>24</span></div><div class="live"><span class="avatar">M</span><span><b>Mica Stream</b><small>Late Night Session</small></span><button onclick="go('Grid Studio')">Ver</button></div><div class="live"><span class="avatar">N</span><span><b>Nexus Gaming</b><small>Ranked Rush</small></span><button onclick="toast('Abriendo directo de gaming')">Ver</button></div></div></aside></div>
<div id="modal"></div><div id="toast"></div>
<script>
const tabs=[['⌂','Inicio'],['▶','Pulse'],['●','Grid Studio'],['◈','Gaming'],['◇','Wallet']];let tab='Inicio',following=false,live=false,posts=JSON.parse(localStorage.getItem('grid-preview-posts')||'null')||[
{id:1,n:'Alex Grid',h:'@alexgrid',t:'Bienvenidos a The Grid. Un nuevo espacio para crear, compartir y transmitir sin salir de tu universo.',tm:'Ahora',l:128,c:18,v:1},
{id:2,n:'Mica Stream',h:'@mica',t:'Grid Studio listo. Esta noche probamos el nuevo setup de streaming en vivo. ¿Quién se conecta?',tm:'12 min',l:64,c:9,v:1},
{id:3,n:'Nexus Gaming',h:'@nexus',t:'Nuevo Drop desbloqueado: Neon Runner. El evento empieza en 42 minutos.',tm:'31 min',l:42,c:6,v:0}];
function save(){localStorage.setItem('grid-preview-posts',JSON.stringify(posts))}function nav(){document.getElementById('nav').innerHTML=tabs.map(x=>`<button class="${tab===x[1]?'active':''}" onclick="go('${x[1]}')">${x[0]}<span>${x[1]}</span></button>`).join('')}function go(x){tab=x;document.getElementById('title').textContent=x;nav();render()}function toast(x){let e=document.getElementById('toast');e.innerHTML=`<div class="toast">✓ ${x}</div>`;setTimeout(()=>e.innerHTML='',2200)}function compose(){go('Inicio');setTimeout(()=>document.getElementById('composer')?.focus(),30)}function render(){let q=(document.getElementById('search')?.value||'').toLowerCase();let v=document.getElementById('view');if(tab==='Inicio'){let ps=posts.filter(p=>`${p.n} ${p.h} ${p.t}`.toLowerCase().includes(q));v.innerHTML=`<section class="hero"><span class="online"><i/> ONLINE</span><h2>Tu red.<br><em>Tu universo.</em></h2><p>Comparte ideas, descubre Pulse y entra en directo con The Grid.</p><div class="orb"><b>G</b></div></section><section class="composer"><span class="avatar g">G</span><div class="composerMain"><textarea id="composer" placeholder="¿Qué está pasando en tu mundo?"></textarea><div class="composerBottom"><div><button onclick="toast('Selector de imagen listo')">▧ Foto</button><button onclick="toast('Selector de video listo')">▶ Video</button><button onclick="toast('Encuesta creada en modo demo')">◒ Encuesta</button></div><button class="publish" onclick="publish()">Publicar</button></div></div></section><div class="heading"><div><span class="eyebrow">LIVE FEED</span><h2>Para ti</h2></div><button onclick="toast('Feed actualizado')">Actualizar ↻</button></div>${ps.map(p=>`<article class="post"><span class="avatar">${p.n[0]}</span><div class="postBody"><div class="meta"><div><b>${p.n}</b>${p.v?'<span class="verified">✓</span>':''} <span class="muted">${p.h} · ${p.tm}</span></div><span class="muted">•••</span></div><p>${p.t}</p><div class="actions"><button class="${p.liked?'liked':''}" onclick="like(${p.id})">${p.liked?'♥':'♡'} ${p.l}</button><button onclick="toast('Comentarios estarán disponibles en la siguiente capa')">◌ ${p.c}</button><button onclick="toast('Publicación preparada para compartir')">↗ Compartir</button><button onclick="toast('Guardado en tu colección')">◇</button></div></div></article>`).join('')}`}else if(tab==='Pulse'){v.innerHTML=`<section class="module"><div class="moduleHero"><span class="eyebrow">SHORT VIDEO</span><h2>Pulse <em>in motion.</em></h2><p>Descubre clips verticales, creadores y momentos que están encendiendo The Grid.</p><button class="moduleButton" onclick="toast('Reproducción de Pulse iniciada')">▶ Explorar Pulse</button></div><div class="cards"><button class="pulse" onclick="toast('Reproduciendo Night Drive')"><strong>Night Drive<br><small>@mica · 18.4K views</small></strong></button><button class="pulse" onclick="toast('Reproduciendo Ranked Rush')"><strong>Ranked Rush<br><small>@nexus · 9.8K views</small></strong></button></div></section>`}else if(tab==='Grid Studio'){v.innerHTML=`<section class="module"><div class="studio"><div class="moduleHero"><span class="eyebrow">BROADCAST CONTROL</span><h2>Grid Studio</h2><p>Tu centro de emisión. Controla el estado del canal y prepara tu directo.</p><button class="moduleButton" onclick="live=!live;render();toast(live?'Transmisión iniciada en modo demo':'Transmisión detenida')">${live?'■ Detener transmisión':'● Iniciar transmisión'}</button></div><div class="preview"><div><b>G</b><br><strong>${live?'● EN DIRECTO · 128 espectadores':'PREVIEW · Listo para emitir'}</strong></div></div></div><div class="stats"><div class="stat"><small>ESPECTADORES</small><b>${live?'128':'—'}</b></div><div class="stat"><small>CALIDAD</small><b>1080p</b></div><div class="stat"><small>ESTADO</small><b class="green">● Ready</b></div></div></section>`}else if(tab==='Gaming'){v.innerHTML=`<section class="module"><div class="moduleHero"><span class="eyebrow">GAMING NEXUS</span><h2>Juega. Mira function publish(){let e=document.getElementById('composer'),t=e.value.trim();if(!t)return;posts.unshift({id:Date.now(),n:'Tú',h:'@usuario',t,tm:'Ahora',l:0,c:0,v:0});e.value='';save();render();toast('Publicación compartida en tu feed')}function like(id){let p=posts.find(x=>x.id===id);p.liked=!p.liked;p.l+=p.liked?1:-1;save();render()}function toggleFollow(){following=!following;document.getElementById('follow').textContent=following?'Siguiendo':'Seguir';toast(following?'Ahora sigues a tu perfil demo':'Has dejado de seguir')}function openNotifications(){document.getElementById('modal').innerHTML=`<div class="modalBg" onclick="closeModal(event)"><div class="modal"><div class="modalHead"><div><span class="eyebrow">ACTIVIDAD</span><h2>Notificaciones</h2></div><button class="close" onclick="closeModal()">×</button></div><div class="notice"><span class="avatar">A</span><p><b>Alex Grid</b> empezó a seguirte.<small>Hace 4 min</small></p></div><div class="notice"><span class="avatar">M</span><p><b>Mica Stream</b> publicó en Grid Studio.<small>Hace 12 min</small></p></div><div class="notice"><span class="avatar">N</span><p><b>Nexus Gaming</b> desbloqueó un Drop.<small>Hace 31 min</small></p></div></div></div>`}function openProfile(){document.getElementById('modal').innerHTML=`<div class="modalBg" onclick="closeModal(event)"><div class="modal"><div class="modalHead"><div><span class="eyebrow">CUENTA</span><h2>Tu perfil</h2></div><button class="close" onclick="closeModal()">×</button></div><div style="text-align:center;padding:24px"><span class="avatar g" style="width:70px;height:70px;margin:auto;font-size:22px">G</span><h3>Tu perfil</h3><span class="muted">@usuario</span><p class="muted">Preview funcional de The Grid. Tus publicaciones de demo se guardan localmente en este navegador.</p><button class="moduleButton" onclick="toast('Perfil guardado en modo demo');closeModal()">Guardar cambios</button></div></div></div>`}function closeModal(e){if(!e||e.target.className==='modalBg')document.getElementById('modal').innerHTML=''}nav();render();
