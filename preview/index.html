<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#08080b">
<title>The Grid</title>
<style>
:root{--bg:#07070a;--surface:#0d0d11;--surface2:#17181c;--line:#25252b;--text:#f7f7f8;--muted:#a4a4ad;--purple:#8239e8;--purple2:#9349f5;--bottom:138px;--header:140px}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}body{min-height:100vh}button,input{font:inherit}button{border:0;cursor:pointer;color:inherit}svg{display:block}
.app{min-height:100vh;background:var(--bg)}
.header{height:var(--header);padding:22px 42px 18px 48px;display:flex;align-items:center;justify-content:space-between;border-bottom:2px solid #202126;background:#0b0b0f;position:sticky;top:0;z-index:20}
.brand{display:flex;align-items:center;gap:24px}.brandLogo{width:70px;height:82px;position:relative;display:grid;place-items:center}.brandLogo svg{width:70px;height:70px}.brandSub{position:absolute;bottom:-1px;left:0;width:100%;font-family:Georgia,serif;font-size:16px;color:#9b9ba4;letter-spacing:-.8px;text-align:center;white-space:nowrap;transform:rotate(-1deg)}.brandName{font-size:45px;line-height:1;font-weight:850;letter-spacing:-2px}.bell{width:58px;height:58px;background:transparent;color:#a7a7af;display:grid;place-items:center}.bell svg{width:50px;height:50px;stroke-width:2.1}
.main{min-height:calc(100vh - var(--header));padding-bottom:calc(var(--bottom) + env(safe-area-inset-bottom));max-width:1024px;margin:0 auto}.page{padding:46px 40px 0}.pageTitle{font-size:58px;line-height:1.05;margin:0;font-weight:850;letter-spacing:-2.8px}.pageTitleRow{display:flex;align-items:center;justify-content:space-between}.add{width:102px;height:102px;border-radius:50%;background:linear-gradient(145deg,#7d35df,#8642ed);display:grid;place-items:center;box-shadow:0 8px 26px #7e35df3b}.add svg{width:54px;height:54px;stroke:#fff;stroke-width:2.1}
.storyRow{height:270px;margin:46px -40px 0;padding:0 70px;border-bottom:2px solid var(--line);display:flex;align-items:flex-start}.story{padding-top:0;text-align:center;color:#a7a7af}.storyRing{width:160px;height:160px;border-radius:50%;border:7px dashed #24252a;display:grid;place-items:center}.storyRing svg{width:58px;height:58px;stroke:#a6a6af;stroke-width:2}.storyLabel{font-size:25px;font-weight:650;margin-top:20px}
.empty{min-height:760px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:30px 24px 100px}.emptyIcon{width:162px;height:162px;border-radius:42px;background:#222225;display:grid;place-items:center;color:#a7a7b1;margin-bottom:48px}.emptyIcon svg{width:74px;height:74px;stroke:currentColor;stroke-width:1.8}.empty h2{font-size:38px;line-height:1.15;margin:0 0 20px;font-weight:820;letter-spacing:-1.2px}.empty p{font-size:31px;line-height:1.35;color:#a5a5ad;margin:0;max-width:760px;font-weight:550}
.bottomNav{position:fixed;left:0;right:0;bottom:0;height:var(--bottom);padding:14px 30px max(14px,env(safe-area-inset-bottom));background:#0b0b0f;border-top:2px solid #202126;display:grid;grid-template-columns:repeat(6,1fr);z-index:30}.navItem{background:transparent;color:#a6a6ae;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:9px;font-size:23px;font-weight:620}.navItem svg{width:54px;height:54px;stroke:currentColor;stroke-width:1.7}.navItem.active{color:var(--purple2)}
.searchBox{height:112px;border:2px solid #29292f;background:#0f0f14;border-radius:32px;margin-top:50px;display:flex;align-items:center;gap:24px;padding:0 30px;color:#a7a7af}.searchBox svg{width:44px;height:44px;stroke-width:1.8}.searchBox input{background:transparent;border:0;outline:0;color:#fff;font-size:35px;font-weight:600;width:100%}.searchBox input::placeholder{color:#9e9ea7}.tabs{display:flex;border-bottom:2px solid #2a2a30;margin-top:42px;height:74px}.tab{flex:0 0 260px;background:transparent;color:#a3a3ac;font-size:35px;font-weight:650;position:relative}.tab.active{color:#f4f4f5}.tab.active:after{content:"";position:absolute;bottom:-2px;left:50%;width:82px;height:5px;transform:translateX(-50%);border-radius:8px;background:var(--purple2)}
.plainEmpty{min-height:900px}.plainEmpty .emptyIcon{margin-bottom:42px}.plainEmpty h2{margin-bottom:18px}.messages .empty{padding-top:160px}.messages .emptyIcon{margin-bottom:52px}.lives .empty,.pulses .empty{padding-top:130px}.notifications .empty{padding-top:120px}
.profileCard{margin-top:54px;border:2px solid #28282e;border-radius:34px;padding:30px;background:#0d0d11}.profileHead{display:flex;align-items:center;gap:22px}.profileAvatar{width:100px;height:100px;border-radius:30px;background:linear-gradient(145deg,#7637e0,#db5ee8);display:grid;place-items:center;font-size:42px;font-weight:850}.profileMeta h2{font-size:31px;margin:0 0 5px}.profileMeta p{font-size:23px;color:#9999a2;margin:0}.profileStats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:30px}.profileStat{background:#18181c;border-radius:22px;padding:22px;text-align:center}.profileStat b{display:block;font-size:29px}.profileStat span{font-size:18px;color:#9898a0}
.sheetBackdrop{position:fixed;inset:0;background:#0009;z-index:60;opacity:0;pointer-events:none;transition:opacity .2s}.sheet{position:fixed;left:0;right:0;bottom:0;z-index:70;background:#1a1d20;border-radius:44px 44px 0 0;padding:28px 34px calc(28px + env(safe-area-inset-bottom));transform:translateY(105%);transition:transform .25s ease;max-height:92vh;overflow:auto}.sheet.open{transform:translateY(0)}.sheetBackdrop.open{opacity:1;pointer-events:auto}.handle{width:72px;height:6px;border-radius:20px;background:#aaaeb8;margin:0 auto 22px}.sheetTime{font-size:35px;font-weight:800;margin:0 0 42px}.sheet h2{font-size:36px;margin:0 0 34px}.filterSection{margin:0}.filterLabel{font-size:25px;color:#9fa3ad;font-weight:700;margin:22px 0 14px}.filterRow{min-height:92px;display:flex;align-items:center;gap:25px;font-size:32px;font-weight:600}.filterRow .ico{width:45px;height:45px;flex:none}.radio{margin-left:auto;width:54px;height:54px;border:3px solid #a6afbd;border-radius:50%;position:relative}.radio.checked{border-color:var(--purple2)}.radio.checked:after{content:"";position:absolute;inset:10px;border-radius:50%;background:var(--purple2)}
@media(max-width:700px){:root{--header:92px;--bottom:84px}.header{height:var(--header);padding:11px 16px 10px 18px}.brand{gap:11px}.brandLogo{width:47px;height:62px}.brandLogo svg{width:47px;height:47px}.brandSub{font-size:11px;bottom:0}.brandName{font-size:25px;letter-spacing:-1.1px}.bell{width:42px;height:42px}.bell svg{width:36px;height:36px}.main{padding-bottom:calc(var(--bottom) + env(safe-area-inset-bottom))}.page{padding:30px 20px 0}.pageTitle{font-size:42px;letter-spacing:-2px}.add{width:70px;height:70px}.add svg{width:40px;height:40px}.storyRow{height:205px;margin:32px -20px 0;padding:0 35px}.storyRing{width:105px;height:105px;border-width:5px}.storyRing svg{width:43px;height:43px}.storyLabel{font-size:18px;margin-top:12px}.empty{min-height:calc(100vh - 92px - 84px);padding:20px 18px 70px}.emptyIcon{width:122px;height:122px;border-radius:32px;margin-bottom:30px}.emptyIcon svg{width:60px;height:60px}.empty h2{font-size:27px;margin-bottom:13px}.empty p{font-size:22px;max-width:650px}.bottomNav{height:var(--bottom);padding:6px 4px max(6px,env(safe-area-inset-bottom))}.navItem{font-size:11px;gap:3px}.navItem svg{width:34px;height:34px}.searchBox{height:70px;border-radius:22px;margin-top:28px;padding:0 18px;gap:12px}.searchBox svg{width:30px;height:30px}.searchBox input{font-size:22px}.tabs{margin-top:24px;height:54px}.tab{flex:1;font-size:22px}.tab.active:after{width:60px;height:4px}.plainEmpty{min-height:calc(100vh - 92px - 84px - 80px)}.messages .empty,.lives .empty,.pulses .empty,.notifications .empty{padding-top:50px}.profileCard{margin-top:30px;border-radius:25px}.profileAvatar{width:75px;height:75px;border-radius:22px;font-size:30px}.profileMeta h2{font-size:23px}.profileMeta p{font-size:16px}.profileStats{margin-top:20px}.profileStat{padding:15px;border-radius:15px}.profileStat b{font-size:21px}.profileStat span{font-size:13px}.sheet{padding:18px 20px calc(18px + env(safe-area-inset-bottom));border-radius:34px 34px 0 0}.handle{width:54px;height:5px;margin-bottom:18px}.sheetTime{font-size:25px;margin-bottom:26px}.sheet h2{font-size:27px;margin-bottom:18px}.filterLabel{font-size:18px;margin:15px 0 8px}.filterRow{min-height:64px;font-size:21px;gap:15px}.filterRow .ico{width:31px;height:31px}.radio{width:37px;height:37px;border-width:2px}.radio.checked:after{inset:7px}}
@media(min-width:701px){.bottomNav{max-width:1024px;margin:0 auto}.bottomNav:before{content:"";position:fixed;left:0;right:0;bottom:0;height:var(--bottom);background:#0b0b0f;z-index:-1}.main{border-left:1px solid #18181c;border-right:1px solid #18181c}.header{position:relative}.bottomNav{position:fixed;left:50%;right:auto;width:100%;transform:translateX(-50%)}}
</style>
</head>
<body>
<div class="app">
<header class="header">
  <div class="brand">
    <div class="brandLogo">
      <svg viewBox="0 0 70 70" fill="none" aria-hidden="true"><defs><linearGradient id="lg" x1="10" y1="60" x2="60" y2="8" gradientUnits="userSpaceOnUse"><stop stop-color="#a246ff"/><stop offset="1" stop-color="#38b9ff"/></linearGradient></defs><g stroke="url(#lg)" stroke-width="3.2"><path d="M15 23 34 10l21 12-2 24-20 13-20-13z"/><path d="m15 23 18 16 22-17M34 10l-1 29m1 29V39m-21 7 21-7 20 7"/></g><circle cx="15" cy="23" r="4.2" fill="#a246ff"/><circle cx="34" cy="10" r="4.2" fill="#8c4aff"/><circle cx="55" cy="22" r="4.2" fill="#3dbaff"/><circle cx="53" cy="46" r="4.2" fill="#5ca5ff"/><circle cx="33" cy="59" r="4.2" fill="#9d48ff"/><circle cx="13" cy="46" r="4.2" fill="#a246ff"/></svg>
      <div class="brandSub">'he grid'</div>
    </div>
    <div class="brandName">The Grid</div>
  </div>
  <button class="bell" aria-label="Notificaciones" onclick="go('Notificaciones')"><svg viewBox="0 0 48 48" fill="none"><path d="M12 34h24c-3-3-4-6-4-12 0-6-3.2-10-8-10s-8 4-8 10c0 6-1 9-4 12Z" stroke="currentColor" stroke-linejoin="round"/><path d="M19 39c.9 2 2.3 3 5 3s4.1-1 5-3" stroke="currentColor" stroke-linecap="round"/></svg></button>
</header>
<main class="main" id="main"></main>
<nav class="bottomNav" id="bottomNav"></nav>
</div>
<div class="sheetBackdrop" id="backdrop" onclick="closeSheet()"></div>
<section class="sheet" id="filterSheet" aria-label="Filtros de notificaciones">
  <div class="handle"></div><p class="sheetTime" id="sheetTime">00:34 ☾</p><h2>Filtros</h2>
  <div id="filters"></div>
</section>
<script>
const icons={
 home:'<svg viewBox="0 0 48 48" fill="none"><path d="m8 22 16-13 16 13v17a3 3 0 0 1-3 3H11a3 3 0 0 1-3-3V22Z" stroke="currentColor" stroke-linejoin="round"/><path d="M19 42V28h10v14" stroke="currentColor" stroke-linejoin="round"/></svg>',
 search:'<svg viewBox="0 0 48 48" fill="none"><circle cx="21" cy="21" r="13" stroke="currentColor"/><path d="m31 31 10 10" stroke="currentColor" stroke-linecap="round"/></svg>',
 pulse:'<svg viewBox="0 0 48 48" fill="none"><path d="m27 5-16 21h12l-2 17 16-22H25l2-16Z" stroke="currentColor" stroke-linejoin="round"/></svg>',
 live:'<svg viewBox="0 0 48 48" fill="none"><circle cx="24" cy="24" r="4" fill="currentColor"/><path d="M16 17a10 10 0 0 0 0 14M32 17a10 10 0 0 1 0 14M11 12a17 17 0 0 0 0 24M37 12a17 17 0 0 1 0 24" stroke="currentColor" stroke-linecap="round"/></svg>',
 message:'<svg viewBox="0 0 48 48" fill="none"><path d="M7 9h34v25H19L9 42v-8H7V9Z" stroke="currentColor" stroke-linejoin="round"/></svg>',
 profile:'<svg viewBox="0 0 48 48" fill="none"><circle cx="24" cy="15" r="7" stroke="currentColor"/><path d="M10 42c1-9 7-13 14-13s13 4 14 13" stroke="currentColor" stroke-linecap="round"/></svg>',
 plus:'<svg viewBox="0 0 48 48" fill="none"><path d="M24 9v30M9 24h30" stroke="currentColor" stroke-linecap="round"/></svg>',
 sparkle:'<svg viewBox="0 0 48 48" fill="none"><path d="m25 5 4 14 14 4-14 4-4 16-4-16-14-4 14-4 4-14Z" stroke="currentColor" stroke-linejoin="round"/><path d="m39 7 1 4 4 1-4 1-1 4-1-4-4-1 4-1 1-4ZM10 34l1 3 3 1-3 1-1 3-1-3-3-1 3-1 1-3Z" stroke="currentColor" stroke-linejoin="round"/></svg>',
 peopleSearch:'<svg viewBox="0 0 48 48" fill="none"><circle cx="19" cy="16" r="7" stroke="currentColor"/><path d="M7 37c1-7 5-11 12-11 3 0 6 1 8 3" stroke="currentColor" stroke-linecap="round"/><circle cx="34" cy="32" r="6" stroke="currentColor"/><path d="m38 36 5 5" stroke="currentColor" stroke-linecap="round"/></svg>',
 filters:['<svg viewBox="0 0 48 48" fill="none"><rect x="5" y="10" width="38" height="28" rx="4" stroke="currentColor"/><path d="m10 18 7 6 7-7 7 5" stroke="currentColor" stroke-linecap="round"/></svg>','<svg viewBox="0 0 48 48" fill="none"><path d="M9 16h18a7 7 0 0 1 0 14H18l-7 7v-7H9a7 7 0 0 1 0-14Z" stroke="currentColor"/><path d="M19 20v6m4-6v6" stroke="currentColor"/></svg>','<svg viewBox="0 0 48 48" fill="none"><circle cx="24" cy="24" r="16" stroke="currentColor" stroke-dasharray="7 5"/><path d="M24 14v10l6 4" stroke="currentColor" stroke-linecap="round"/></svg>','<svg viewBox="0 0 48 48" fill="none"><path d="m24 5 5 4 7-1 1 7 6 4-4 6 2 7-7 2-4 6-6-4-7 2-2-7-6-4 4-6-1-7 7-1 5-6Z" stroke="currentColor"/><path d="m17 24 5 5 10-11" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"/></svg>','<svg viewBox="0 0 48 48" fill="none"><circle cx="17" cy="16" r="6" stroke="currentColor"/><path d="M7 36c1-7 5-11 10-11 4 0 8 2 10 6" stroke="currentColor" stroke-linecap="round"/><path d="m34 11 2 4 4 1-4 1-2 4-1-4-4-1 4-1 1-4Z" stroke="currentColor"/></svg>'],
 bell:'<svg viewBox="0 0 48 48" fill="none"><path d="M11 35h26c-3-3-4-7-4-13 0-6-3-10-9-10s-9 4-9 10c0 6-1 10-4 13Z" stroke="currentColor"/><path d="M20 40c1 2 2 3 4 3s3-1 4-3" stroke="currentColor" stroke-linecap="round"/></svg>'
};
const nav=[['Inicio','home'],['Buscar','search'],['Pulses','pulse'],['Lives','live'],['Mensajes','message'],['Perfil','profile']];
let current='Inicio';
function navRender(){document.getElementById('bottomNav').innerHTML=nav.map(([name,key])=>`<button class="navItem ${current===name?'active':''}" onclick="go('${name}')">${icons[key]}<span>${name}</span></button>`).join('')}
function shell(title,body,cls=''){return `<div class="page ${cls}"><div class="pageTitleRow"><h1 class="pageTitle">${title}</h1>${['Inicio','Mensajes'].includes(title)?`<button class="add" onclick="toast('Crear ${title==='Inicio'?'publicación':'conversación'}')">${icons.plus}</button>`:''}</div>${body}</div>`}
function empty(icon,title,text,cls=''){return `<div class="empty ${cls}"><div class="emptyIcon">${icons[icon]}</div><h2>${title}</h2><p>${text}</p></div>`}
function render(){
 navRender();
 let html='';
 if(current==='Inicio') html=shell('Inicio',`<div class="storyRow"><div class="story"><div class="storyRing">${icons.plus}</div><div class="storyLabel">Tu story</div></div></div>${empty('sparkle','Todavía no hay publicaciones','Seguí usuarios para llenar tu feed.')}`);
 if(current==='Buscar') html=shell('Buscar',`<div class="searchBox">${icons.search}<input id="q" placeholder="Buscar usuarios o hashtags" oninput="searchHint()"></div><div class="tabs"><button class="tab active">Usuarios</button><button class="tab">Hashtags</button></div>${empty('peopleSearch','Buscá creadores','Escribí un @username para encontrar personas.')}`);
 if(current==='Pulses') html=shell('Pulses',empty('pulse','Todavía no hay pulses','Sé el primero en subir un video corto vertical.','plainEmpty'),'pulses');
 if(current==='Lives') html=shell('Lives',empty('live','No hay directos en vivo','Cuando un creador comience a transmitir, aparecerá aquí.','plainEmpty'),'lives');
 if(current==='Mensajes') html=shell('Mensajes',empty('message','No tienes conversaciones','Empezá una nueva conversación con el botón +.','plainEmpty'),'messages');
 if(current==='Perfil') html=shell('Perfil',`<div class="profileCard"><div class="profileHead"><div class="profileAvatar">G</div><div class="profileMeta"><h2>Tu perfil</h2><p>@usuario</p></div></div><div class="profileStats"><div class="profileStat"><b>0</b><span>Seguidores</span></div><div class="profileStat"><b>0</b><span>Siguiendo</span></div><div class="profileStat"><b>0</b><span>Pulses</span></div></div></div>`);
 if(current==='Notificaciones') html=shell('Notificaciones',empty('bell','Sin notificaciones','Tus likes, comentarios, seguidores y menciones aparecerán aquí.','plainEmpty'),'notifications');
 document.getElementById('main').innerHTML=html;
}
function go(name){current=name;render();window.scrollTo({top:0,behavior:'smooth'})}
function toast(msg){const old=document.querySelector('.toast');if(old)old.remove();const t=document.createElement('div');t.className='toast';t.textContent=msg;t.style.cssText='position:fixed;left:50%;bottom:110px;transform:translateX(-50%);z-index:90;background:#202026;border:1px solid #8a40ee88;border-radius:16px;padding:13px 18px;font-size:16px;font-weight:650;box-shadow:0 15px 50px #000b';document.body.appendChild(t);setTimeout(()=>t.remove(),1800)}
function searchHint(){const q=document.getElementById('q');if(q&&q.value.trim())toast('Buscando '+q.value.trim())}
function openSheet(){document.getElementById('backdrop').classList.add('open');document.getElementById('filterSheet').classList.add('open')}
function closeSheet(){document.getElementById('backdrop').classList.remove('open');document.getElementById('filterSheet').classList.remove('open')}
function renderFilters(){const labels=['No leídos','No respondidos','Respuestas a historias','Perfiles verificados','Más de 10.000 seguidores'];const less=['Seguidores','Marcados','Seguidos','Empresas','Reservado','Pedido','Pagado','Enviado','Cliente potencial'];let i=0;document.getElementById('filters').innerHTML='<div>'+labels.map((x)=>`<div class="filterRow"><span class="ico">${icons.filters[i++]}</span><span>${x}</span><span class="radio"></span></div>`).join('')+'</div><div class="filterLabel">Ver menos</div>'+less.map((x)=>`<div class="filterRow"><span class="ico">${icons.filters[i++%icons.filters.length]}</span><span>${x}</span><span class="radio"></span></div>`).join('');document.getElementById('sheetTime').textContent=new Date().toLocaleTimeString('es-AR',{hour:'2-digit',minute:'2-digit',hour12:false})+' ☾'}
renderFilters();render();
</script>
</body>
</html>
